# DigitalOcean App Platform spec
# Create the app once in the DO UI (or: doctl apps create --spec .do/app.yaml)
# Then every push to the selected branch auto-deploys.
#
# IMPORTANT:
# 1. Replace github.repo / github.branch with your values OR create via UI.
# 2. Set secrets in the DigitalOcean dashboard (do not commit real passwords).
# 3. After first deploy, set PUBLIC_URL to your DO app HTTPS URL.
# 4. File uploads: local disk is ephemeral on App Platform.
#    For production photos, configure DigitalOcean Spaces (S3) later.

name: carpool-directus
region: blr

services:
  - name: directus
    github:
      repo: kapeel45/carpool-app
      branch: untested-code
      deploy_on_push: true
    source_dir: directus
    dockerfile_path: Dockerfile
    http_port: 8055
    instance_count: 1
    instance_size_slug: basic-xs
    health_check:
      http_path: /server/health
    envs:
      - key: KEY
        scope: RUN_TIME
        type: SECRET
      - key: SECRET
        scope: RUN_TIME
        type: SECRET
      - key: ADMIN_EMAIL
        scope: RUN_TIME
        value: you@example.com
      - key: ADMIN_PASSWORD
        scope: RUN_TIME
        type: SECRET
      - key: DB_CLIENT
        scope: RUN_TIME
        value: "pg"
      - key: DB_HOST
        scope: RUN_TIME
        value: ${db.HOSTNAME}
      - key: DB_PORT
        scope: RUN_TIME
        value: ${db.PORT}
      - key: DB_DATABASE
        scope: RUN_TIME
        value: ${db.DATABASE}
      - key: DB_USER
        scope: RUN_TIME
        value: ${db.USERNAME}
      - key: DB_PASSWORD
        scope: RUN_TIME
        value: ${db.PASSWORD}
      - key: PUBLIC_URL
        scope: RUN_TIME
        value: ${APP_URL}
      - key: STORAGE_LOCATIONS
        scope: RUN_TIME
        value: local
      - key: STORAGE_LOCAL_DRIVER
        scope: RUN_TIME
        value: local
      - key: STORAGE_LOCAL_ROOT
        scope: RUN_TIME
        value: /directus/uploads
      - key: CORS_ENABLED
        scope: RUN_TIME
        value: "true"
      - key: CORS_ORIGIN
        scope: RUN_TIME
        value: "*"
      - key: WEBSOCKETS_ENABLED
        scope: RUN_TIME
        value: "true"

databases:
  - name: db
    engine: PG
    version: "16"
    production: true
    # Use "dev" if you want a cheaper DB for testing:
    # production: false
    # cluster_name: carpool-directus-db
    size: db-s-dev-database
